<style>

  html, body { margin:0; padding:0; height:100%; }

  .rule { width:48px; height:2px; background:#1e63d6; margin:0 auto 22px; }

      <path d="M22 20 V34 a10 10 0 0 0 20 0 V27" stroke="#0C2036" stroke-width="5.2" stroke-linecap="round" fill="none"></path>
